name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for OpenCascade
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest -q
      - name: Every preset still passes the printability checker
        run: python -m benchtop_fixtures.build --out /tmp/exports
